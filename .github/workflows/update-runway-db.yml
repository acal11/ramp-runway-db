name: Update Runway Database

on:
  schedule:
    - cron: '0 4 * * 1'   # Monday 04:00 UTC weekly
  workflow_dispatch:        # manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate airports.json and runways.json
        run: python3 generate_runway_db.py --output-dir /tmp/runway-build

      - name: Compute version tag
        id: meta
        run: |
          TAG="runway-db-$(date -u +%Y%m%d)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Sign and write manifest.json
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          TAG: ${{ steps.meta.outputs.tag }}
          DATE: ${{ steps.meta.outputs.date }}
          REPO: ${{ github.repository }}
        run: |
          pip install cryptography --quiet
          python3 - <<'EOF'
          import os, base64, hashlib, json
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          priv = Ed25519PrivateKey.from_private_bytes(
              base64.b64decode(os.environ["SIGNING_PRIVATE_KEY"]))

          def sign_file(path):
              with open(path, "rb") as f:
                  sha256_hex = hashlib.sha256(f.read()).hexdigest()
              signature = base64.b64encode(priv.sign(sha256_hex.encode())).decode()
              print(f"{os.path.basename(path)}: sha256={sha256_hex[:16]}… sig={signature[:16]}…")
              return sha256_hex, signature

          tag, repo = os.environ["TAG"], os.environ["REPO"]
          base_url = f"https://github.com/{repo}/releases/download/{tag}"

          airports_sha, airports_sig = sign_file("/tmp/runway-build/airports.json")
          runways_sha,  runways_sig  = sign_file("/tmp/runway-build/runways.json")

          manifest = {
              "version": tag,
              "date": os.environ["DATE"],
              "minAppVersion": "1.0",
              "airports": {"sha256": airports_sha, "signature": airports_sig, "url": f"{base_url}/airports.json"},
              "runways":  {"sha256": runways_sha,  "signature": runways_sig,  "url": f"{base_url}/runways.json"},
          }
          with open("/tmp/runway-build/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print("Signed manifest written.")
          EOF

      - name: Create GitHub Release and upload assets
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "Runway DB ${{ steps.meta.outputs.tag }}" \
            --notes "Weekly OurAirports data update (airports.json + runways.json)." \
            /tmp/runway-build/airports.json \
            /tmp/runway-build/runways.json \
            /tmp/runway-build/manifest.json \
            --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
